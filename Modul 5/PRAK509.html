<!DOCTYPE html>
<html>
<body>
    <p>Klik tombol berikut untuk menampilkan konfirmasi</p>
    <button onclick="myFunction()">Klik Disini</button>
    <p id="demo"></p>
    
    <script>
        function myFunction() {
            var nama = prompt("Silahkan masukkan nama anda", "Calon Seniman");
            if (nama != null) {
                var x = "Selamat Datang " + nama + ", bagaimana kabar anda hari ini?";
                document.getElementById("demo").innerHTML = x;
            }
        }
    </script>
</body>
</html>
