<html>
    <head>
        <title> Pendaftaran Kursus </title>
    </head>
    <body>
        <table border="2" width="600" cellpadding="10" cellspacing="0">
            <tr>
                <td bgcolor="#87CEEB" align="center">
                    <font face="Arial" size="6" color="red"><b> Pendaftaran Kursus </b></font>
                </td>
            </tr>
            
            <tr>
                <td bgcolor="#808080">
                    <font face="Arial" size="4"><b> Data Diri </b></font>
                    <br><br>
                    <table border="0" width="100%">
                        <tr>
                            <td width="30%">Nama</td>
                            <td><input type="text" name="nama" size="30"></td>
                        </tr>
                        <tr>
                            <td>Nim</td>
                            <td><input type="text" name="nim" size="30"></td>
                        </tr>
                        <tr>
                            <td>E-mail</td>
                            <td><input type="text" name="email" size="30"></td>
                        </tr>
                        <tr>
                            <td>Tanggal Lahir</td>
                            <td><input type="text" name="tgl_lahir" size="30" value="hh/bb/tttt"></td>
                        </tr>
                        <tr>
                            <td valign="top">Jenis Kelamin</td>
                            <td>
                                <input type="radio" name="jk" value="L"> Laki-laki<br>
                                <input type="radio" name="jk" value="P"> Perempuan
                            </td>
                        </tr>
                        <tr>
                            <td valign="top">Pilih Program Kursus</td>
                            <td>
                                <input type="checkbox" name="kursus" value="C#"> C#<br>
                                <input type="checkbox" name="kursus" value="Java"> Java<br>
                                <input type="checkbox" name="kursus" value="SQL"> SQL<br>
                                <input type="checkbox" name="kursus" value="HTML_PHP"> HTML dan PHP
                            </td>
                        </tr>
                        <tr>
                            <td>Pilihan Hari/Jam Kursus</td>
                            <td>
                                <select name="jadwal">
                                    <option value="senin_rabu">Senin - Rabu/09.00 - 11.00</option>
                                    <option value="selasa_kamis">Selasa - Kamis/09.00 - 11.00</option>
                                </select>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr>
                <td bgcolor="#FA8072">
                    Komentar Anda<br>
                    <textarea name="komentar" cols="70" rows="5"></textarea>
                    <br><br>
                    <input type="reset" value="Reset">
                    <input type="submit" value="Submit">
                    <input type="button" value="Cancel">
                </td>
            </tr>
        </table>
    </body>
</html>
